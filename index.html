<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Warna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        #color_area {
            height: 400px;
            background-color: rgb(0, 0, 0);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row mb-3">
            <div class="col" id="color_area"></div>
        </div>
        <div class="row text-center">
            <div class="col d-grid">
                <button type="button" class="btn btn-danger" onclick="merah()">merah</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-primary" onclick="biru()">Biru</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-success" onclick="hijau()">hijau</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn btn-warning" onclick="kuning()">kuning</button>
            </div>
            <div class="col d-grid">
                <button type="button" class="btn"
                style="background-color: pink;" onclick="ubahwarna('pink')">pink</button>
            </div>
            <div class="alert alert-light text-center mt-5" role="alert">
                ZAHRA JUNITA | 25/556015/SV/25870 | PGWEB ACARA 3 
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

        <script>
            //function untuk mengubah warna menjadi merah
            function merah (){
                document.getElementById("color_area").style.
                backgroundColor = "red";
            }
             //function untuk mengubah warna menjadi biru
            function biru (){
                document.getElementById("color_area").style.
                backgroundColor = "blue";
            }
             //function untuk mengubah warna menjadi hijau
            function hijau (){
                document.getElementById("color_area").style.
                backgroundColor = "green";
            }
             //function untuk mengubah warna menjadi kuning
            function kuning (){
                document.getElementById("color_area").style.
                backgroundColor = "yellow";
            }

            //function untuk mengubah warna menjadi kuning
            function ubahwarna (pink){
                document.getElementById("color_area").style.
                backgroundColor = "pink";
            }
        </script>
</body>

</html>
